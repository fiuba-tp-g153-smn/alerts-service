[project]
name = "alerts-service"
version = "0.1.0"
description = "Servicio que maneja la gestión de alertas"
authors = [
    { name = "Agustín Altamirano", email = "aaltamirano@fi.uba.ar" },
    { name = "Gabriel Diem", email = "wdiem@fi.uba.ar" },
    { name = "Máximo Gismondi", email = "magismondi@fi.uba.ar" },
    { name = "Matías Valeriani", email = "mvaleriani@fi.uba.ar" }
]
requires-python = ">=3.13,<4.0"

[tool.poetry]
packages = [{ include = "src" }]
package-mode = false

[tool.poetry.dependencies]
fastapi = "^0.135.1"
newrelic = "^11.5.0"
uvicorn = "^0.41.0"
python-dotenv = "^1.2.2"
geopandas = "^1.1.3"
shapely = "^2.1.2"
aiohttp = "^3.13.3"
apscheduler = "^3.11.0"
aioboto3 = "^15.5.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
pytest-socket = "^0.7.0"
pre-commit = "^4.5.1"
mypy = "^1.19.1"
pylint = "^4.0.5"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--disable-socket --allow-hosts=127.0.0.1"
testpaths = ["tests/application"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'src')"

[tool.pylint.similarities]
min-similarity-lines = 8

[tool.pylint.design]
max-attributes = 10
max-args = 10
max-positional-arguments = 8
max-locals = 20
