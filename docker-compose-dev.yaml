# Alerts Service - Geographic Intersection API (Development)
#
# This service provides endpoints for geographic intersection operations:
# - Intersect polygon with Argentina's territory
# - Intersect polygon with Argentine departments
#
# Features:
# - Downloads and simplifies IGN geographic layers on startup
# - Caches processed data in ./data volume for fast restarts
# - Hot-reload enabled for development
#
# Usage:
#   docker compose -f docker-compose-dev.yaml up
#
# Access:
#   - API: http://localhost:8080
#   - Swagger docs: http://localhost:8080/docs

services:
  db:
    image: mysql:8.0
    container_name: alerts-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root2024}
      MYSQL_DATABASE: aviso_gempak
      MYSQL_USER: avisos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "avisos", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  alerts-service:
    container_name: alerts-service-dev-container
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${APP_HOST_PORT}:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./output/alerts:/app/output/alerts
      - ./.env:/app/.env:ro
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - APP_ENV=${APP_ENV}
      - OGR_GEOJSON_MAX_OBJ_SIZE=0
      - SIMPLIFY_TOLERANCE=${SIMPLIFY_TOLERANCE}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=aviso_gempak
      - MYSQL_USER=avisos
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - OUTPUT_DIR=/app/output/alerts
      - ALERT_CACHE_DIR=/app/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
      start_interval: 10s

volumes:
  mysql_data:
