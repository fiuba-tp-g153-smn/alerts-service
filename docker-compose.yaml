# Alerts Service - Geographic Intersection API (Production)
#
# This service provides endpoints for geographic intersection operations:
# - Intersect polygon with Argentina's territory
# - Intersect polygon with Argentine departments
#
# Features:
# - Downloads and simplifies IGN geographic layers on startup
# - Caches processed data in named volume for persistence
# - Production-ready configuration
#
# Usage:
#   docker compose up -d
#
# Access:
#   - API: http://localhost:8080
#   - Swagger docs: http://localhost:8080/docs

services:
  db:
    image: mysql:8.0
    container_name: alerts-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root2024}
      MYSQL_DATABASE: aviso_gempak
      MYSQL_USER: avisos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-avisos2024}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "avisos", "-p${MYSQL_PASSWORD:-avisos2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alerts_service_network

  alerts-service:
    container_name: alerts-service-container
    image: alerts-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - alerts_service_data:/app/data
      - alerts_output:/app/output/alerts
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - APP_ENV=${APP_ENV}
      - OGR_GEOJSON_MAX_OBJ_SIZE=0
      - SIMPLIFY_TOLERANCE=${SIMPLIFY_TOLERANCE}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=aviso_gempak
      - MYSQL_USER=avisos
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-avisos2024}
      - OUTPUT_DIR=/app/output/alerts
      - ALERT_CACHE_DIR=/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
      start_interval: 10s
    networks:
      - alerts_service_network

networks:
  alerts_service_network:
    driver: bridge

volumes:
  alerts_service_data:
    driver: local
  alerts_output:
    driver: local
  mysql_data:
    driver: local
