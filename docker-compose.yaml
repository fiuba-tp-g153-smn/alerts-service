# Alerts Service - Geographic Intersection API (Production)
#
# This service provides endpoints for geographic intersection operations:
# - Intersect polygon with Argentina's territory
# - Intersect polygon with Argentine departments
#
# Features:
# - Downloads and simplifies IGN geographic layers on startup
# - Caches processed data in named volume for persistence
# - Production-ready configuration
#
# Usage:
#   docker compose up -d
#
# Access:
#   - API: http://localhost:8080
#   - Swagger docs: http://localhost:8080/docs

services:
  mysql:
    image: mysql:8.0
    container_name: alerts-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alerts_service_network

  alerts-service:
    container_name: alerts-service-container
    stop_grace_period: 1m
    image: alerts-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_HOST_PORT}:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - alerts_service_data:/app/data
      - alerts_output:/app/output/alerts
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - APP_ENV=${APP_ENV}
      - OGR_GEOJSON_MAX_OBJ_SIZE=0
      - SETTINGS_FILE=${SETTINGS_FILE}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_SECURE=${S3_SECURE}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - OUTPUT_DIR=${OUTPUT_DIR}
      - ALERT_CACHE_DIR=${ALERT_CACHE_DIR}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 8m
      start_interval: 10s
    networks:
      - alerts_service_network

networks:
  alerts_service_network:
    driver: bridge

volumes:
  alerts_service_data:
    driver: local
  alerts_output:
    driver: local
  mysql_data:
    driver: local
